name: Release dry run

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Prospective v-prefixed release tag (defaults to package version)
        required: false
        type: string
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - .github/workflows/release*.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Validate prospective release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${REQUESTED_TAG:-v$(node -p "require('./package.json').version")}"
          node scripts/validate-release.mjs "$release_tag"
          archive="$(npm pack --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => process.stdout.write(JSON.parse(data)[0].filename))")"
          node scripts/validate-release.mjs "$release_tag" "$archive"
      - name: Release notes preview
        run: |
          node /tmp/releasebox/bin/releasebox.js notes . > release-notes-preview.md
          cat release-notes-preview.md
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
